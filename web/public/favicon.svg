<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="favicon-title"
>
  <title id="favicon-title">PrismAgent</title>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="#20252b" />

  <!-- Incoming light beam (left → prism) -->
  <path d="M6 32 L26 32" stroke="#c7cfd7" stroke-width="3" stroke-linecap="round" />

  <!-- Prism triangle (white) -->
  <path d="M32 16 L48 44 L16 44 Z" fill="#f7f9fa" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Inner prism facet shading -->
  <path d="M32 16 L32 44 L48 44 Z" fill="#dde3ea" />

  <!-- Refracted beams (prism → right), fan-out -->
  <!-- Beam 1: teal -->
  <path d="M32 28 L58 18" stroke="#2f8f63" stroke-width="3.5" stroke-linecap="round" />
  <!-- Beam 2: light blue -->
  <path d="M34 32 L58 32" stroke="#4f9dd9" stroke-width="3.5" stroke-linecap="round" />
  <!-- Beam 3: deep blue -->
  <path d="M32 36 L58 46" stroke="#2864a8" stroke-width="3.5" stroke-linecap="round" />
</svg>
